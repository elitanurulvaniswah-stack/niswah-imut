<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cek Kesehatan 💊</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pinky: '#FFC0CB',
                        darkpink: '#FF69B4',
                    },
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .bounce {
                animation: bounce 2s infinite;
            }
            @keyframes bounce {
                0%, 100% { transform: translateY(-5%); }
                50% { transform: translateY(5%); }
            }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-pinky to-white min-h-screen flex items-center justify-center font-sans relative overflow-hidden">

    <!-- Stiker Hiasan -->
    <i class="fa fa-heartbeat absolute top-10 left-10 text-6xl text-darkpink/20 rotate-12"></i>
    <i class="fa fa-stethoscope absolute bottom-10 right-10 text-6xl text-darkpink/20 -rotate-12"></i>
    <i class="fa fa-medkit absolute top-1/2 left-5 text-5xl text-darkpink/20"></i>
    <i class="fa fa-ambulance absolute top-1/3 right-5 text-5xl text-darkpink/20"></i>

    <div class="bg-white p-8 md:p-12 rounded-3xl shadow-2xl text-center max-w-md z-10 border-4 border-darkpink/30">
        
        <!-- Icon Utama -->
        <div class="text-9xl text-darkpink mb-6 bounce">
            <i class="fa fa-user-md"></i>
        </div>

        <h1 class="text-[clamp(1.5rem,5vw,2.5rem)] font-bold text-darkpink mb-4">
            Apakah Anda Sudah Sehat?
        </h1>
        
        <p class="text-gray-600 mb-8 text-lg">
            Klik tombol di bawah ini untuk mengetahui jawabannya ✨
        </p>

        <div id="result" class="min-h-[40px] text-lg font-semibold text-green-600 mb-6"></div>

        <div class="flex justify-center gap-6 items-center flex-wrap">
            <button id="btnYes" class="px-10 py-4 bg-green-500 hover:bg-green-600 text-white font-bold rounded-full text-lg shadow-lg transform transition hover:scale-105 active:scale-95">
                <i class="fa fa-check mr-2"></i> IYA
            </button>
            
            <button id="btnNo" class="px-10 py-4 bg-red-500 hover:bg-red-600 text-white font-bold rounded-full text-lg shadow-lg transition">
                <i class="fa fa-times mr-2"></i> TIDAK
            </button>
        </div>
    </div>

    <script>
        const btnYes = document.getElementById('btnYes');
        const btnNo = document.getElementById('btnNo');
        const result = document.getElementById('result');

        // Pesan positif
        const messages = [
            "Semoga sehat selalu! 🥰",
            "Tetap jaga pola makan ya! 🥗",
            "Rajin olahraga supaya badan fit! 🏃‍♂️",
            "Minum air putih yang cukup ya! 💧",
            "Wah, tubuh yang sehat itu aset berharga! ❤️"
        ];

        // Event klik IYA
        btnYes.addEventListener('click', () => {
            const randomIndex = Math.floor(Math.random() * messages.length);
            result.textContent = messages[randomIndex];
            result.classList.remove('text-red-500');
            result.classList.add('text-green-600');
        });

        // Event klik TIDAK (lari)
        btnNo.addEventListener('mouseover', function(e) {
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;
            const btnWidth = btnNo.offsetWidth;
            const btnHeight = btnNo.offsetHeight;

            // Hitung posisi random yang aman
            const randomX = Math.floor(Math.random() * (windowWidth - btnWidth - 200)) + 100;
            const randomY = Math.floor(Math.random() * (windowHeight - btnHeight - 200)) + 100;

            btnNo.style.position = "absolute";
            btnNo.style.left = randomX + "px";
            btnNo.style.top = randomY + "px";
        });

        // Cadangan untuk layar sentuh
        btnNo.addEventListener('click', function(e) {
            e.preventDefault();
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;
            const btnWidth = btnNo.offsetWidth;
            const btnHeight = btnNo.offsetHeight;

            const randomX = Math.floor(Math.random() * (windowWidth - btnWidth - 100));
            const randomY = Math.floor(Math.random() * (windowHeight - btnHeight - 100));

            btnNo.style.position = "absolute";
            btnNo.style.left = randomX + "px";
            btnNo.style.top = randomY + "px";
        });
    </script>
</body>
</html>
