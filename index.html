<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Speed Typer</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#111827;
    overflow:hidden;
    transition:0.3s;
}

.container{
    width:90%;
    max-width:500px;
    background:white;
    padding:40px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

h1{
    margin-bottom:20px;
    color:#111827;
}

.word{
    font-size:40px;
    font-weight:bold;
    margin:30px 0;
    color:#2563eb;
}

input{
    width:100%;
    padding:15px;
    font-size:20px;
    border:2px solid #ccc;
    border-radius:12px;
    outline:none;
    text-align:center;
}

.score{
    margin-top:20px;
    font-size:24px;
    font-weight:bold;
    color:#16a34a;
}

.info{
    margin-top:10px;
    color:#555;
}

/* Efek benar */
.correct{
    background:#22c55e !important;
}

/* Efek shake */
.shake{
    animation:shake 0.3s;
}

@keyframes shake{
    0%{transform:translateX(0);}
    25%{transform:translateX(-10px);}
    50%{transform:translateX(10px);}
    75%{transform:translateX(-10px);}
    100%{transform:translateX(0);}
}
</style>
</head>

<body>

<div class="container" id="box">
    <h1>The Speed Typer ⌨️</h1>

    <div class="word" id="word">loading...</div>

    <input type="text" id="input" placeholder="Ketik kata di sini..." autocomplete="off">

    <div class="score">Skor: <span id="score">0</span></div>

    <div class="info">
        Ketik dengan cepat dan benar!
    </div>
</div>

<script>
const words = [
    "sekolah",
    "komputer",
    "javascript",
    "indonesia",
    "kecepatan",
    "belajar",
    "internet",
    "programming",
    "keyboard",
    "teknologi",
    "semangat",
    "python",
    "website",
    "digital",
    "coding"
];

const wordElement = document.getElementById("word");
const input = document.getElementById("input");
const scoreElement = document.getElementById("score");
const body = document.body;
const box = document.getElementById("box");

let currentWord = "";
let score = 0;

// Ambil kata random
function randomWord(){
    return words[Math.floor(Math.random() * words.length)];
}

// Tampilkan kata
function showWord(){
    currentWord = randomWord();
    wordElement.textContent = currentWord;
}

showWord();

// Saat mengetik
input.addEventListener("keyup", () => {

    if(input.value.trim() === currentWord){

        // Tambah skor
        score++;
        scoreElement.textContent = score;

        // Background hijau sebentar
        body.classList.add("correct");

        setTimeout(() => {
            body.classList.remove("correct");
        }, 200);

        // Reset input
        input.value = "";

        // Kata baru
        showWord();

    } else if(currentWord.startsWith(input.value.trim())){

        // Jika masih benar sebagian
        box.classList.remove("shake");

    } else {

        // Jika salah → shake
        box.classList.add("shake");

        setTimeout(() => {
            box.classList.remove("shake");
        }, 300);
    }

});
</script>

</body>
</html>
